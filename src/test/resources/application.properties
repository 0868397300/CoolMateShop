# ===================================================================
# TEST PROFILE WITH H2 IN-MEMORY DATABASE (MSSQL Compatibility Mode)
# ===================================================================
spring.application.name=CoolMateShopTest
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false

vnpay.tmnCode=TEST_TMN
vnpay.hashSecret=TEST_SECRET_HASH_1234567890ABCDEF
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/thanh-toan/vnpay-return
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

app.base-url=http://localhost:8080
