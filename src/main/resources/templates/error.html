<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - Coolmate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm" style="max-width: 520px; width: 90%;">
        <div class="mb-3">
            <i class="bi bi-info-circle text-primary display-4" th:if="${status == null or status < 500}"></i>
            <i class="bi bi-exclamation-triangle text-warning display-4" th:if="${status != null and status >= 500}"></i>
        </div>
        <h4 class="fw-bold mb-3" th:text="${title != null ? title : 'Thông Báo Từ Coolmate'}">Thông Báo</h4>
        <p class="text-secondary mb-4" th:text="${message}">Không tìm thấy nội dung yêu cầu.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">Quay Lại</a>
            <a th:href="@{/}" class="btn btn-dark rounded-pill px-4">Trang Chủ</a>
        </div>
    </div>
</body>
</html>
