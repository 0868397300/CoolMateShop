<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm / Sửa Sản Phẩm - Coolmate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4" style="font-family: 'Plus Jakarta Sans', sans-serif;">
    <div class="container bg-white p-4 rounded-4 shadow-sm" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Thêm Mới Sản Phẩm & Ma Trận SKU</h4>
            <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary">Quay lại Dashboard</a>
        </div>
        <form>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên sản phẩm</label>
                <input type="text" class="form-control" placeholder="Áo Thun Cotton Compact...">
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Danh mục</label>
                    <select class="form-select">
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Áo Nam</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Giá niêm yết (VNĐ)</label>
                    <input type="number" class="form-control" placeholder="299000">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Chất liệu vải</label>
                <input type="text" class="form-control" placeholder="95% Cotton Compact, 5% Spandex">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Mô tả đặc tính nổi bật</label>
                <textarea class="form-control" rows="4" placeholder="Co giãn 4 chiều, chống nhăn bai xù..."></textarea>
            </div>
            <button type="button" class="btn btn-dark rounded-pill px-4">Lưu Sản Phẩm</button>
        </form>
    </div>
</body>
</html>
