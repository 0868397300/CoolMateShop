<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết Quả Thanh Toán - Coolmate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;">
    <div class="bg-white p-5 rounded-4 shadow-sm text-center" style="max-width: 520px;">
        <div th:if="${success}" class="text-success display-1 mb-3"><i class="bi bi-check-circle-fill"></i></div>
        <div th:unless="${success}" class="text-danger display-1 mb-3"><i class="bi bi-x-circle-fill"></i></div>

        <h3 class="fw-bold mb-2" th:text="${success ? 'Giao Dịch VNPAY Thành Công!' : 'Giao Dịch Không Thành Công'}">Kết quả</h3>
        <p class="text-muted small" th:text="${orderInfo}">Nội dung thanh toán</p>
        
        <div class="p-3 bg-light rounded-3 text-start small mb-4">
            <div class="d-flex justify-content-between mb-1">
                <span class="text-muted">Mã giao dịch VNPAY:</span>
                <strong th:text="${transactionNo}">VNP123456</strong>
            </div>
            <div class="d-flex justify-content-between mb-1">
                <span class="text-muted">Số tiền thanh toán:</span>
                <strong class="text-primary" th:text="${#numbers.formatDecimal((amount != null ? amount : 0), 0, 'COMMA', 0, 'POINT')} + 'đ'">249,000đ</strong>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Trạng thái:</span>
                <span class="badge" th:classappend="${success} ? 'bg-success' : 'bg-danger'" th:text="${success ? 'ĐÃ THANH TOÁN' : 'THẤT BẠI'}">ĐÃ THANH TOÁN</span>
            </div>
        </div>

        <div class="d-flex gap-2 justify-content-center">
            <a th:href="@{/}" class="btn btn-dark rounded-pill px-4">Về Trang Chủ</a>
            <a th:href="@{/don-hang}" class="btn btn-outline-dark rounded-pill px-4">Xem Đơn Hàng</a>
        </div>
    </div>
</body>
</html>
