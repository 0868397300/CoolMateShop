<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Hàng Thành Công - Coolmate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;">
    <div class="bg-white p-5 rounded-4 shadow-sm text-center" style="max-width: 520px;">
        <div class="text-success display-1 mb-3"><i class="bi bi-check-circle-fill"></i></div>
        <h3 class="fw-bold mb-2">Đặt Hàng Thành Công!</h3>
        <p class="text-muted small">Cảm ơn bạn đã lựa chọn Coolmate. Mã đơn hàng của bạn là:</p>
        <div class="p-3 bg-light rounded-3 fw-bold fs-5 text-primary mb-3" th:text="${orderCode}">CM123456789</div>
        <p class="text-muted small">Nhân viên CSKH Coolmate sẽ liên hệ và giao hàng tới bạn trong vòng 24h.</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a th:href="@{/}" class="btn btn-dark rounded-pill px-4">Về Trang Chủ</a>
            <a th:href="@{/don-hang}" class="btn btn-outline-dark rounded-pill px-4">Xem Lịch Sử Đơn</a>
        </div>
    </div>
</body>
</html>
