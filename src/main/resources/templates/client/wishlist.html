<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm Yêu Thích - Coolmate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .product-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; transition: all 0.2s ease; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.08); }
        .product-img { width: 100%; height: 260px; object-fit: cover; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white border-bottom py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a th:href="@{/}" class="text-decoration-none fw-bold fs-4 text-dark">
                COOLMATE<span class="text-primary">.</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/san-pham}" class="btn btn-outline-dark btn-sm rounded-pill"><i class="bi bi-grid me-1"></i>Mua Sắm</a>
                <a th:href="@{/gio-hang}" class="btn btn-primary btn-sm rounded-pill"><i class="bi bi-cart me-1"></i>Giỏ Hàng</a>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-heart-fill text-danger me-2"></i>Danh Sách Yêu Thích</h3>
                <p class="text-muted small mb-0">Lưu lại những sản phẩm bạn quan tâm để mua sắm tiện lợi hơn</p>
            </div>
            <span class="badge bg-light text-dark border p-2 rounded-3 fs-6" th:text="${(items != null ? items.size() : 0) + ' sản phẩm'}">0 sản phẩm</span>
        </div>

        <div th:if="${items == null or items.isEmpty()}" class="text-center py-5 bg-white rounded-4 border p-5">
            <i class="bi bi-heartbreak display-4 text-muted mb-3 d-block"></i>
            <h5 class="fw-bold text-dark">Danh sách yêu thích của bạn đang trống</h5>
            <p class="text-muted small mb-4">Khám phá các sản phẩm nổi bật của Coolmate và thả tim ngay nhé!</p>
            <a th:href="@{/san-pham}" class="btn btn-dark rounded-pill px-4 py-2">Khám Phá Sản Phẩm</a>
        </div>

        <div class="row g-4" th:if="${items != null and !items.isEmpty()}">
            <div class="col-6 col-md-4 col-lg-3" th:each="it : ${items}">
                <div class="product-card h-100 d-flex flex-column">
                    <a th:href="@{'/san-pham/' + ${it.product.slug}}" class="text-decoration-none text-dark">
                        <img th:src="${it.product.images != null and !it.product.images.isEmpty() ? it.product.images[0].imageUrl : '/images/placeholder.png'}" 
                             class="product-img" alt="Product image">
                        <div class="p-3 pb-0 flex-grow-1">
                            <h6 class="fw-bold text-truncate mb-1" th:text="${it.product.name}">Tên sản phẩm</h6>
                            <div class="text-danger fw-bold fs-6" th:text="${#numbers.formatDecimal(it.product.basePrice != null ? it.product.basePrice : 0, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                249,000đ
                            </div>
                        </div>
                    </a>
                    <div class="p-3 pt-2 mt-auto d-flex gap-2">
                        <a th:href="@{'/san-pham/' + ${it.product.slug}}" class="btn btn-dark btn-sm rounded-pill w-100">Xem Chi Tiết</a>
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-circle px-2" 
                                th:onclick="'toggleWishlist(' + ${it.product.id} + ')'" title="Bỏ yêu thích">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function getCsrfToken() {
            const match = document.cookie.match(new RegExp('(^|;\\s*)XSRF-TOKEN=([^;]*)'));
            if (match) return decodeURIComponent(match[2]);
            const metaToken = document.querySelector('meta[name="_csrf"]');
            return metaToken ? metaToken.getAttribute('content') : '';
        }

        function toggleWishlist(productId) {
            fetch(`/api/wishlist/toggle/${productId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-XSRF-TOKEN': getCsrfToken()
                }
            })
                .then(res => res.json())
                .then(data => {
                    location.reload();
                })
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
