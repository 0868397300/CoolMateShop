# ===================================================================
# COOLMATESHOP - APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=CoolMateShop
server.port=8080

# -------------------------------------------------------------------
# KẾT NỐI MICROSOFT SQL SERVER
# -------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CoolMate_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate JPA cho SQL Server
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Tắt tự động nạp script JDBC để tránh xung đột
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Cấu hình Static Resource & Uploads
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Cấu hình Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Cấu hình Cổng thanh toán VNPAY Sandbox
# -------------------------------------------------------------------
vnpay.tmnCode=COOLMATE1
vnpay.hashSecret=AXYZAXYZAXYZAXYZ1234567890ABCDEF
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/thanh-toan/vnpay-return
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# -------------------------------------------------------------------
# Cấu hình Base URL & Email SMTP (LỖI 10 & 11)
# -------------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
