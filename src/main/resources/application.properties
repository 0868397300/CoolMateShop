# ===================================================================
# COOLMATESHOP - APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=CoolMateShop
server.port=8080

# -------------------------------------------------------------------
# KẾT NỐI MICROSOFT SQL SERVER
# -------------------------------------------------------------------
# LƯU Ý QUAN TRỌNG: 
# Nếu gặp lỗi "Login failed for user 'sa'":
# Bạn hãy đổi mật khẩu 'spring.datasource.password' bên dưới đúng với mật khẩu
# tài khoản 'sa' của SQL Server trên máy bạn (ví dụ: 123456, 123, admin, root, 12345678...).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CoolMate_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate JPA cho SQL Server
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
# Chỉ định rõ ràng SQLServerDialect để tránh lỗi 'Unable to determine Dialect'
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Tắt tự động nạp script JDBC để tránh xung đột
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Cấu hình Static Resource & Uploads
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Cấu hình Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Cấu hình Cổng thanh toán VNPAY Sandbox
# -------------------------------------------------------------------
vnpay.tmnCode=COOLMATE1
vnpay.hashSecret=AXYZAXYZAXYZAXYZ1234567890ABCDEF
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/thanh-toan/vnpay-return
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
