# ===================================================================
# COOLMATESHOP - APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=CoolMateShop
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------
# KẾT NỐI MICROSOFT SQL SERVER (Mã hóa credentials qua Environment Variables)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=CoolMate_DB;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate JPA cho SQL Server
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Tắt tự động nạp script JDBC để tránh xung đột
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Cấu hình Static Resource & Uploads
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Cấu hình Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Cấu hình Cổng thanh toán VNPAY (Environment Variables)
# -------------------------------------------------------------------
vnpay.tmnCode=${VNPAY_TMN_CODE:COOLMATE1}
vnpay.hashSecret=${VNPAY_HASH_SECRET:AXYZAXYZAXYZAXYZ1234567890ABCDEF}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/thanh-toan/vnpay-return}
vnpay.apiUrl=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# -------------------------------------------------------------------
# Cấu hình Base URL & Email SMTP
# -------------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
