# ===================================================================
# COOLMATESHOP - PRODUCTION PROFILE CONFIGURATION
# ===================================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# SQL Server Production Connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# VNPAY Production Credentials
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=${VNPAY_PAY_URL:https://pay.vnpay.vn/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL}
vnpay.apiUrl=${VNPAY_API_URL:https://pay.vnpay.vn/merchant_webapi/api/transaction}
